services:
  rules:
    image: online-deanery-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "uvicorn", "backend.logic:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"
    volumes:
      - ./backend/data/rules.json:/app/backend/data/rules.json:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    image: online-deanery-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      INTERNAL_TIMEOUT: ${INTERNAL_TIMEOUT:-300}
      BACKEND2_URL: http://rules:8002/answer
      ML1_URL: "${ML1_URL:-http://host.docker.internal:8001/ocr}"
      ML2_URL: "${ML2_URL:-http://host.docker.internal:8003/extract}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://admin:super_password@db:5432/deanery}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      rules:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  ml1:
    build:
      context: .
      dockerfile: ml1/Dockerfile
    container_name: deanery_ml1
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PADDLEOCR_VL_URL: ${PADDLEOCR_VL_URL:-http://llama:8080/v1/chat/completions}
      PADDLEOCR_VL_TIMEOUT: ${PADDLEOCR_VL_TIMEOUT:-180}
      # Актуальный llama-server (>=fix ad19f21, напр. b11429/v0.6.0) нуждается в чистом
      # "OCR:" -> =0 (замер: CER 0.85 с маркером против 0.10 без, baton.png).
      # =1 только для старого b8110.
      PADDLEOCR_VL_LEGACY_MEDIA: ${PADDLEOCR_VL_LEGACY_MEDIA:-0}
      # YOLO-детектор подписей (Mels22 YOLO11s 4cls -> models/signature.onnx).
      # Печать без YOLO ищется классикой синего кольца (см. ml1/detector.py).
      YOLO_SIG_MODEL_PATH: ${YOLO_SIG_MODEL_PATH:-/models/signature.onnx}
      # YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-} — печать своей YOLOv8n, если обучите
      # YOLO_CONFIDENCE: ${YOLO_CONFIDENCE:-0.3} — Mels22 находит подпись от conf 0.349 (замер baton.png)
      YOLO_INTRA_OP_THREADS: ${YOLO_INTRA_OP_THREADS:-0}
    depends_on:
      - llama
    restart: unless-stopped

  ml2:
    build:
      context: .
      dockerfile: ml2/Dockerfile
    container_name: deanery_ml2
    environment:
      LLM_URL: ${LLM_URL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-12}
    ports:
      - "8003:8003"
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: deanery_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      # Не храните реальные пароли в репо: задайте POSTGRES_PASSWORD в .env (см. .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_password}
      POSTGRES_DB: ${POSTGRES_DB:-deanery}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-deanery}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: deanery_llama
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    command:
      - -m
      - /models/PaddleOCR-VL-1.6-GGUF.gguf
      - --mmproj
      - /models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --threads
      - "${LLAMA_THREADS:--1}"
      - --threads-batch
      - "${LLAMA_THREADS:--1}"
      - --temp
      - "0"
      # PaddleOCR-VL's Spotting task requires the 1,605,632-pixel input limit
      # documented by the model card (1,605,632 / 28² = 2,048 image tokens).
      - --image-max-tokens
      - "2048"
    restart: unless-stopped

volumes:
  postgres_data:
